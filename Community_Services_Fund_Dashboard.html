<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Services Fund Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F4F6F5;
  --surface:#FFFFFF;
  --ink:#1B2A33;
  --muted:#5D6B74;
  --rule:#D5DCD9;
  --accent:#1F6F78;
  --focus:#C98A2B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131B20;
    --surface:#1A252C;
    --ink:#E6EDEB;
    --muted:#9AAAB2;
    --rule:#2D3B44;
    --accent:#64B6BE;
    --focus:#E0A94A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 48px}
a.back{color:var(--accent);text-decoration:none;font-size:14px;display:inline-block;margin-bottom:12px}
a.back:hover{text-decoration:underline}
header{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:20px}
h1{
  font-family:Georgia,"Times New Roman",serif;
  font-weight:600;
  font-size:30px;
  letter-spacing:-0.01em;
  margin:0 0 4px;
}
header p{margin:0;color:var(--muted);font-size:14px}

.groupbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin:0 0 20px;
}
.groupbar .groupbar-label{font-size:13px;color:var(--muted);margin-right:6px}
.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border:1px solid var(--rule);border-radius:999px;
  background:var(--surface);cursor:pointer;font-size:14px;
}
.pill:hover{border-color:var(--muted)}
.pill:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600}
.pill input{accent-color:var(--accent);margin:0;width:15px;height:15px}

.layout{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
@media (max-width:800px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px}
fieldset{border:0;margin:0 0 22px;padding:0;min-width:0}
fieldset:last-child{margin-bottom:0}
legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:8px}
.opt{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:4px;cursor:pointer;
}
.opt:hover{background:var(--bg)}
.opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.opt span{font-size:15px}
input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
select{
  width:100%;padding:9px 10px;font:inherit;
  background:var(--bg);color:var(--ink);
  border:1px solid var(--rule);border-radius:4px;
}
.hidden{display:none !important}
.subreport{margin-top:22px;border-top:1px solid var(--rule);padding-top:18px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.subreport h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:18px;margin:0}
.sub-head select{padding:6px 8px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:4px}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sub-card{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--bg)}
.sub-card h4{margin:0 0 2px;font-size:14px}
.sub-card .sub-total{font-size:13px;color:var(--muted);margin:0 0 8px;font-variant-numeric:tabular-nums}
.sub-card ol{margin:0;padding-left:0;list-style:none}
.sub-card li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
.sub-card li:first-child{border-top:none}
.sub-card .code{color:var(--muted)}
.sub-card .pct{color:var(--muted);margin-left:6px}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:22px;margin:0 0 4px}
.total{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted);margin:0 0 14px}
.total strong{color:var(--ink);font-weight:600}
.chartbox{position:relative;height:380px}
.note{font-size:13px;color:var(--muted);margin:12px 0 0}
table{width:100%;border-collapse:collapse;margin-top:26px;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-weight:600;color:var(--muted);font-size:13px}
tbody tr:hover{background:var(--bg)}
tr.total-row td{font-weight:600;border-bottom:none;border-top:2px solid var(--rule)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:middle}
.table-wrap{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Back to home</a>
  <header>
    <h1>Community Services Fund Dashboard</h1>
    <p>Actual results for 2022-23 through 2024-25, revised budget for 2025-26, and budget for 2026-27.</p>
  </header>

  <div class="groupbar" id="groupFieldset" role="radiogroup" aria-label="Grouping">
    <span class="groupbar-label">Grouping</span>
    <label class="pill"><input type="radio" name="group" value="revenue" checked><span>Revenue by source</span></label>
    <label class="pill"><input type="radio" name="group" value="object"><span>Expenditure by object</span></label>
    <label class="pill"><input type="radio" name="group" value="netprog"><span>Revenue and expenditure by program</span></label>
  </div>

  <div class="layout">
    <aside class="panel" aria-label="Dashboard controls">
      <fieldset>
        <legend>View</legend>
        <label class="opt"><input type="radio" name="view" value="trend" checked><span>Trend, 2022-23 to 2026-27</span></label>
        <label class="opt"><input type="radio" name="view" value="pie"><span>Share of one year</span></label>
      </fieldset>

      <fieldset id="unitFieldset">
        <legend>Amounts</legend>
        <label class="opt"><input type="radio" name="unit" value="dollars" checked><span>Dollars</span></label>
        <label class="opt"><input type="radio" name="unit" value="percent"><span>Percent of total</span></label>
      </fieldset>

      <fieldset id="yearFieldset" class="hidden">
        <legend><label for="yearSelect">Year</label></legend>
        <select id="yearSelect"></select>
      </fieldset>
    </aside>

    <main class="panel" aria-live="polite">
      <h2 id="title"></h2>
      <p class="total" id="totalLine"></p>
      <div class="chartbox" id="chartBox"><canvas id="chart" role="img" aria-label="Chart of community services fund dashboard data"></canvas></div>
      <p class="note" id="note"></p>

      <section id="subreport" class="subreport hidden" aria-label="Top line items by category">
        <div class="sub-head">
          <h3>Top 5 line items by category</h3>
          <label>Year <select id="subYear"></select></label>
        </div>
        <div class="sub-grid" id="subGrid"></div>
      </section>

      <section id="progSubreport" class="subreport hidden" aria-label="Breakdown by program">
        <div class="sub-head">
          <h3>Breakdown by program</h3>
          <label>Year <select id="progYear"></select></label>
        </div>
        <div class="sub-grid" id="progGrid"></div>
      </section>

      <div class="table-wrap">
        <table>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

</div>

function renderNet() {
  ["subreport", "progSubreport"].forEach(id => $(id).classList.add("hidden"));

    `difference <strong>${fmt(totDiff)}</strong>`;
  $("note").textContent = "Difference is revenue less expenditure. A negative difference means expenditure was more than revenue.";

  $("chartBox").style.height = Math.max(380, rows.length * 34 + 80) + "px";
  if (chart) { chart.destroy(); chart = null; }
  const textColor = css("--ink");
  const gridColor = css("--rule");
  Chart.defaults.color = css("--muted");
  Chart.defaults.font.family = "system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
  chart = new Chart($("chart"), {
    type: "bar",
    data: {
      labels: rows.map(r => r.name),
      datasets: [
        { label: "Revenue", data: rows.map(r => r.rev), backgroundColor: css("--accent"), borderWidth: 0 },
        { label: "Expenditure", data: rows.map(r => r.exp), backgroundColor: css("--focus"), borderWidth: 0 }
      ]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { grid: { color: gridColor }, ticks: { callback: v => fmtM(v) } },
        y: { grid: { color: gridColor }, ticks: { autoSkip: false } }
      },
      plugins: {
        legend: { position: "bottom", labels: { color: textColor, usePointStyle: true, boxWidth: 8 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.x)}` } }
      }
    }
  });

  $("thead").innerHTML = "<th>Program</th><th>Revenue</th><th>Expenditure</th><th>Difference</th><th>Difference as % of revenue</th>";
  const body = rows.map(r =>
    `<tr><td>${r.name}</td><td>${fmt(r.rev)}</td><td>${fmt(r.exp)}</td><td>${fmt(r.diff)}</td>` +
    `<td>${r.rev ? ((r.diff / r.rev) * 100).toFixed(1) + "%" : "-"}</td></tr>`
  ).join("");
  $("tbody").innerHTML = body +
    `<tr class="total-row"><td>Total</td><td>${fmt(totRev)}</td><td>${fmt(totExp)}</td><td>${fmt(totDiff)}</td>` +
    `<td>${totRev ? ((totDiff / totRev) * 100).toFixed(1) + "%" : "-"}</td></tr>`;
}

function render() {
  if (state.group === "netprog") { renderNet(); return; }
  $("chartBox").style.height = "";

  $("groupFieldset").classList.remove("hidden");
  $("chartBox").classList.remove("hidden");

  const g = GROUPS[state.group];
  const isPie = state.view === "pie";
  const isPercent = !isPie && state.unit === "percent";

  $("yearFieldset").classList.toggle("hidden", !isPie);
  $("unitFieldset").classList.toggle("hidden", isPie);
  $("title").textContent = isPie
    ? `${g.title}, ${YEARS[state.year]}`
    : `${g.title}, 2022-23 to 2026-27${isPercent ? " (percent of total)" : ""}`;

  if (chart) { chart.destroy(); chart = null; }

  const textColor = css("--ink");
  const gridColor = css("--rule");
  const surface = css("--surface");
  Chart.defaults.color = css("--muted");
  Chart.defaults.font.family = "system-ui, -apple-system, Segoe UI, Roboto, sans-serif";

  if (!isPie) {
    $("totalLine").innerHTML = "";
    $("note").textContent = "Values below zero are shown as negative amounts, as they appear in the budget.";
    chart = new Chart($("chart"), {
      type: "bar",
      data: {
        labels: YEARS,
        datasets: sortedByTotal(g).map(({ s, i }) => ({
          label: s.name,
          data: isPercent ? s.values.map((v, j) => (v / yearTotal(g, j)) * 100) : s.values,
          backgroundColor: PALETTE[i % PALETTE.length],
          borderWidth: 0,
          borderRadius: 0
        }))
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        scales: {
          x: { stacked: true, grid: { color: gridColor } },
          y: {
            stacked: true,
            grid: { color: gridColor },
            max: isPercent ? 100 : undefined,
            ticks: { callback: v => isPercent ? v.toFixed(0) + "%" : fmtM(v) }
          }
        },
        plugins: {
          legend: { position: "bottom", labels: { color: textColor, usePointStyle: true, boxWidth: 8 } },
          tooltip: {
            callbacks: {
              label: c => isPercent
                ? `${c.dataset.label}: ${c.parsed.y.toFixed(1)}% (${fmt(g.series.find(s => s.name === c.dataset.label).values[c.dataIndex])})`
                : `${c.dataset.label}: ${fmt(c.parsed.y)}`
            }
          }
        }
      }
    });
  } else {
    const idx = state.year;
    const all = g.series.map((s, i) => ({ name: s.name, value: s.values[idx], color: PALETTE[i % PALETTE.length] }));
    const items = all.filter(x => x.value > 0).sort((a, b) => b.value - a.value);
    const excluded = all.filter(x => x.value <= 0).map(x => x.name);
    const total = items.reduce((a, x) => a + x.value, 0);

    $("totalLine").innerHTML = `Total for ${YEARS[idx]}: <strong>${fmt(yearTotal(g, idx))}</strong>`;
    $("note").textContent = excluded.length
      ? `Not shown in the pie because the amount is zero or negative: ${excluded.join(", ")}.`
      : "";

    chart = new Chart($("chart"), {
      type: "pie",
      plugins: [pieLabels],
      data: {
        labels: items.map(x => x.name),
        datasets: [{
          data: items.map(x => x.value),
          backgroundColor: items.map(x => x.color),
          borderColor: surface,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: "right", labels: { color: textColor, boxWidth: 12 } },
          tooltip: {
            callbacks: {
              label: c => `${c.label}: ${fmt(c.parsed)} (${((c.parsed / total) * 100).toFixed(1)}%)`
            }
          }
        }
      }
    });
  }

  renderTable(g);
  syncSubYears();
  renderSubreport();
  renderProgSubreport();
}

function syncSubYears() {
  const isPie = state.view === "pie";
  if (isPie && state.year >= 1) {
    subYear = state.year;
    progYear = state.year;
  }
  $("subYear").value = String(subYear);
  $("progYear").value = String(progYear);
  $("subYear").disabled = isPie;
  $("progYear").disabled = isPie;
}

function buildProgYearOptions() {
  $("progYear").innerHTML = SUB_YEARS.map((y, i) => `<option value="${i}">${y}</option>`).join("");
  $("progYear").value = String(progYear);
}

function renderProgSubreport() {
  const show = state.group === "program" && PROGRAM_DETAIL.length > 0;
  $("progSubreport").classList.toggle("hidden", !show);
  if (!show) return;
  const idx = state.view === "pie" ? state.year : progYear;
  if (idx < 0) {
    $("progGrid").innerHTML = '<p class="note">Line-item detail begins in 2022-23.</p>';
    return;
  }
  $("progGrid").innerHTML = PROGRAM_ORDER.map(name => {
    const items = PROGRAM_DETAIL.filter(x => x.p === name);
    const total = items.reduce((a, x) => a + x.v[idx], 0);
    const lines = SUB_CATS.map(cat => {
      const it = items.find(x => x.k === cat);
      const amt = it ? it.v[idx] : 0;
      const share = total ? ((amt / total) * 100).toFixed(1) : "0.0";
      return `<li><span>${cat}</span><span>${amt === 0 ? "-" : fmt(amt)}<span class="pct">${share}%</span></span></li>`;
    }).join("");
    return `<div class="sub-card"><h4>${name}</h4><p class="sub-total">Total ${fmt(total)}</p><ol>${lines}</ol></div>`;
  }).join("");
}

function buildSubYearOptions() {
  $("subYear").innerHTML = SUB_YEARS.map((y, i) => `<option value="${i}">${y}</option>`).join("");
  $("subYear").value = String(subYear);
}

function renderSubreport() {
  const show = state.group === "object";
  $("subreport").classList.toggle("hidden", !show);
  if (!show) return;
  const idx = state.view === "pie" ? state.year : subYear;
  if (idx < 0) {
    $("subGrid").innerHTML = '<p class="note">Line-item detail begins in 2022-23.</p>';
    return;
  }
  $("subGrid").innerHTML = SUB_CATS.map(cat => {
    const items = OBJECT_DETAIL.filter(x => x.k === cat);
    const catTotal = items.reduce((a, x) => a + x.v[idx], 0);
    const top = items.filter(x => x.v[idx] > 0).sort((a, b) => b.v[idx] - a.v[idx]).slice(0, 5);
    const lines = top.map(x =>
      `<li><span>${x.d} <span class="code">(${x.c})</span></span>` +
      `<span>${fmt(x.v[idx])}<span class="pct">${catTotal ? ((x.v[idx] / catTotal) * 100).toFixed(1) : "0.0"}%</span></span></li>`
    ).join("");
    return `<div class="sub-card"><h4>${cat}</h4><p class="sub-total">Total ${fmt(catTotal)}</p>` +
           `<ol>${lines || "<li>No positive line items</li>"}</ol></div>`;
  }).join("");
}

document.querySelectorAll('input[name="group"]').forEach(el =>
  el.addEventListener("change", e => { state.group = e.target.value; render(); }));
document.querySelectorAll('input[name="view"]').forEach(el =>
  el.addEventListener("change", e => { state.view = e.target.value; render(); }));
document.querySelectorAll('input[name="unit"]').forEach(el =>
  el.addEventListener("change", e => { state.unit = e.target.value; render(); }));
$("yearSelect").addEventListener("change", e => { state.year = Number(e.target.value); render(); });
$("subYear").addEventListener("change", e => { subYear = Number(e.target.value); renderSubreport(); });
$("progYear").addEventListener("change", e => { progYear = Number(e.target.value); renderProgSubreport(); });

buildYearOptions();
buildSubYearOptions();
buildProgYearOptions();
render();
</script>
</body>
</html>
